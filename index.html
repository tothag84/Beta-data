<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beta Data — Latest Trends</title>
  <style>
    /* Minimal Tech Brutalist — matches src/pipeline/images/style.ts */
    :root {
      --bg: #0f0f0f;
      --fg: #f4f4f0;
      --muted: #8a8a82;
      --line: #2a2a28;
      --accent: #ff5b1f;
      --card: #1a1a18;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      line-height: 1.45;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px 80px; }
    header { border-bottom: 2px solid var(--fg); padding-bottom: 12px; margin-bottom: 24px;h
            display: flex; align-items: baseline; justify-content: space-between; }
    header h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0; text-transform: uppercase; }
    .accent { color: var(--accent); }
    #status { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }

    .stack { display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border: 2px solid var(--fg); overflow: hidden;
           display: flex; flex-direction: column; }
    .card .image { aspect-ratio: 1 / 1; width: 100%; display: block; object-fit: cover;
                  background: repeating-linear-gradient(45deg, #1f1f1d 0 8px, #181816 8px 16px); }
    .card .image.placeholder { display: flex; align-items: center; justify-content: center;
                              color: var(--muted); font-size: 11px;
                              text-transform: uppercase; letter-spacing: 0.1em; }
    .card .body { padding: 16px; }
    .card .meta { display: flex; justify-content: space-between; align-items: center;
                 font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
                 color: var(--muted); margin-bottom: 8px; }
    .card .cat { background: var(--accent); color: var(--bg); padding: 2px 6px; font-weight: 700; }
    .card h3 { margin: 0 0 8px; font-size: 18px; line-height: 1.2; letter-spacing: -0.01em; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }
    .card .source { display: inline-block; margin-top: 12px; color: var(--accent);
                   font-size: 11px; text-decoration: none;
                   border-bottom: 1px solid var(--accent);
                   text-transform: uppercase; letter-spacing: 0.08em; }

    .empty, .error { border: 2px dashed var(--line); padding: 24px; text-align: center;
                    color: var(--muted); font-size: 13px; }
    .error { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Beta<span class="accent">.</span>span>Data</h1>
      <span id="status">loading...</span>span>
      </header>
    
    <section id="stack" class="stack"></section>section>
    </div>div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
  
  // Hardcoded Supabase project credentials.
  // Anon key is public by design — RLS policies in supabase/migrations/
  // are what actually protect the data.
  const SUPABASE_URL = "https://jowcstmfahpqlugtcchu.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_KzgAbB3qwu9-ZUJCzqY4Jg_XgJUaY0W";
  
  const $ = sel => document.querySelector(sel);
  const stack = $("#stack");
  const status = $("#status");
  
  const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
  
  function renderCard(t) {
    const img = t.image_url
      ? `<img class="image" src="${escapeHtml(t.image_url)}" alt="" loading="lazy" />`
      : `<div class="image placeholder">no image</div>`;
    const src = t.source_url
      ? `<a class="source" href="${escapeHtml(t.source_url)}" target="_blank" rel="noopener">view source </a>`
      : "";
    return `
    <article class="card">
    ${img}
    <div class="body">
    <div class="meta">
    <span class="cat">${escapeHtml(t.category)}</span>
    <span>velocity ${escapeHtml(t.velocity_score)}</span>
    </div>
    <h3>${escapeHtml(t.title)}</h3>
    <p>${escapeHtml(t.description)}</p>
    ${src}
    </div>
    </article>
    `;
  }
  
  async function load() {
    status.textContent = "loading...";
    try {
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data, error } = await supabase
        .from("trends")
        .select("id, title, description, image_url, source_url, velocity_score, category, created_at")
        .order("created_at", { ascending: false })
        .limit(5);
      if (error) throw error;
        
        if (!data || data.length === 0) {
          stack.innerHTML = `<div class="empty">No trends yet — run npm run pipeline:fetch to load data.</div>`;
          status.textContent = "empty";
          return;
        }
          stack.innerHTML = data.map(renderCard).join("");
      status.textContent = `${data.length} loaded`;
    } catch (err) {
      stack.innerHTML = `<div class="error">${escapeHtml(err.message || String(err))}</div>`;
      status.textContent = "error";
    }
  }
  
  load();
  </script>
  </body>
</html>html></h1>
      </header>
  </body>
  </style></title>
  </head>
